services:
  postgres:
    image: postgres:16
    container_name: mylook-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mylook}
      POSTGRES_USER: ${POSTGRES_USER:-mylook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mylook}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
