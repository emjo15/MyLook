spring.application.name=mylook-backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mylook}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:mylook}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:mylook}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}
